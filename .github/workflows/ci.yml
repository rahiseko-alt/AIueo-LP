name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # 会員登録フォームのテストは、フォームが有効な状態の画面を見る。
          # NEXT_PUBLIC_ の値はビルド時に埋め込まれるため、ここで渡す。
          # 認証基盤の接続情報（NEON_AUTH_BASE_URL など）は渡していないので、
          # サーバー側は未設定のまま。本番のビルドは Vercel が別に行う。
          NEXT_PUBLIC_NEON_AUTH_ENABLED: 'true'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
